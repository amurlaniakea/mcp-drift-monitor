[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-drift-monitor"
version = "0.1.0"
description = "Continuous MCP Registry Drift Monitor with content-binding revalidation (arXiv:2608.00997)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"  # SPDX-License-Identifier
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
keywords = ["mcp", "security", "drift", "agentic", "arxiv-2608.00997"]
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
mcp-drift-monitor = "mcp_drift_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_drift_monitor*"]

[tool.pytest.ini_options]
markers = [
    "slow: requires network / large model download (panel replay is offline but large)",
]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
